---
name: Lint
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          bundler: 2
          ruby-version: '3.4'

      - uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-3.4-${{ hashFiles('./*.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-gems-3.4-

      - name: Bundle install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run Rubocop
        run: bundle exec rubocop
