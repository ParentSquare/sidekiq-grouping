---
name: Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  rspec:
    name: Rspec
    runs-on: ubuntu-latest
    services:
      redis:
        image: ${{ matrix.redis_image }}
        # Services can't override the container command. The Valkey image
        # appends VALKEY_EXTRA_FLAGS to valkey-server, matching ElastiCache;
        # redis:6.2 ignores it.
        env:
          VALKEY_EXTRA_FLAGS: --extended-redis-compatibility yes
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    strategy:
      matrix:
        # 2.7 for smart_alerts; drop redis:6.2 once every consumer's
        # ElastiCache group runs Valkey.
        ruby_version: ['2.7', '3.4']
        redis_image: ['redis:6.2', 'valkey/valkey:9.1']
    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          bundler: 2
          ruby-version: ${{ matrix.ruby_version }}

      # Appraisal doesn't support vendored install
      # See: https://github.com/thoughtbot/appraisal/issues/173
      #      https://github.com/thoughtbot/appraisal/pull/174
      - name: Bundle install
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec appraisal install

      - name: Run tests
        run: bundle exec appraisal rspec
